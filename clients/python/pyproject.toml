[project]
name = "zorvane-client"
version = "0.1.0"
description = "Subscribe to one Zorvane rover pose over Zenoh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["eclipse-zenoh>=1.10.1,<1.11"]

[project.scripts]
zorvane-pose = "zorvane.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
