[project]
name = "zorvane-client"
version = "0.1.0"
description = "Connect a Zorvane client to the browser simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
native = ["eclipse-zenoh>=1.10.1,<1.11"]

[project.scripts]
zorvane-pose = "zorvane.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
