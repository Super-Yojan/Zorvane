[workspace]
resolver = "3"
members = ["simulator", "crates/zorvane-vehicle", "crates/zorvane-client", "crates/zorvane-browser-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
terra-runtime = { path = "../Terra/crates/terra-runtime" }
zorvane-vehicle = { path = "crates/zorvane-vehicle" }
zorvane-browser-protocol = { path = "crates/zorvane-browser-protocol" }
# Shared robotics crates stay in Terra (TerraPhone and the Pi still compile them).
# Build against the same Terra workspace as the phone app.
terra-transport = { path = "../Terra/crates/terra-transport" }
terra-autonomy = { path = "../Terra/crates/terra-autonomy" }
terra-navigation = { path = "../Terra/crates/terra-navigation" }
terra-experiment = { path = "../Terra/crates/terra-experiment" }
terra-mapping = { path = "../Terra/crates/terra-mapping" }
terra-types = { path = "../Terra/crates/terra-types" }
terra-state = { path = "../Terra/crates/terra-state" }
terra-control = { path = "../Terra/crates/terra-control" }
terra-waypoint = { path = "../Terra/crates/terra-waypoint" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
