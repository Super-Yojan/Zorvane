[workspace]
resolver = "3"
members = ["simulator", "crates/zorvane-vehicle", "crates/zorvane-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
zorvane-vehicle = { path = "crates/zorvane-vehicle" }
# Shared robotics crates stay in Terra (TerraPhone and the Pi still compile them).
# Pin the shared runtime with A* waypoint routing and L4 target search.
terra-transport = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-autonomy = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-navigation = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-experiment = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-mapping = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-types = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-state = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-control = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }
terra-waypoint = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4b582677386b8ed7d5e430585572b83011ea7fc4" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
