[workspace]
resolver = "3"
members = ["simulator", "crates/zorvane-vehicle"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
zorvane-vehicle = { path = "crates/zorvane-vehicle" }
# Shared robotics crates stay in Terra (TerraPhone and the Pi still compile them).
# Pin the same validated L4 runtime used by TerraPhone.
terra-transport = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-autonomy = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-navigation = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-experiment = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-mapping = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-types = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-state = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-control = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }
terra-waypoint = { git = "https://github.com/Super-Yojan/Terra.git", rev = "4fab0a9dfd251f7b1b8d71687d51600aa33502ad" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
