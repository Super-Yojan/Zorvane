services:
  zorvane:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: zorvane:local
    ports:
      - "127.0.0.1:7447:7447"
    environment:
      TERRA_ZENOH_LISTEN: tcp/0.0.0.0:7447
      TERRA_ROVER_COUNT: "1"
      TERRA_HEADLESS: "1"
    shm_size: 1gb
    restart: "no"
