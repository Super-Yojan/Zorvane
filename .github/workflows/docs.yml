name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zorvane-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static wasm sim. Nested under the existing Pages site so this does not
  # replace the docs deploy. A failed play build still publishes the docs.
  play:
    # Pull requests build the sim too, so the Pages artifact can be checked
    # before merge. Only a push to main deploys it.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Trunk
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trunk.tar.gz \
            https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/trunk.tar.gz -C /tmp
          sudo install -m 755 /tmp/trunk /usr/local/bin/trunk
          trunk --version

      - name: Build play site
        working-directory: simulator
        run: trunk build --release --public-url /Zorvane/play/

      - name: Upload play dist
        uses: actions/upload-artifact@v4
        with:
          name: zorvane-play
          path: simulator/dist
          retention-days: 1

  build:
    needs: [play]
    if: always() && needs.play.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust API docs
        run: cargo doc --locked --no-deps -p zorvane-vehicle

      - name: Attach API docs
        run: |
          rm -rf site/api
          mkdir -p site/api
          cp -a target/doc/. site/api/
          if [ ! -f site/api/index.html ]; then
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '<meta charset="utf-8">' \
              '<title>Zorvane API</title>' \
              '<meta http-equiv="refresh" content="0; url=zorvane_vehicle/">' \
              '<link rel="canonical" href="zorvane_vehicle/">' \
              '</head>' \
              '<body>' \
              '<p><a href="zorvane_vehicle/">zorvane-vehicle</a></p>' \
              '</body>' \
              '</html>' > site/api/index.html
          fi

      - name: Attach play build
        if: needs.play.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: zorvane-play
          path: site/play

      - name: Check the play build is inside the site
        if: needs.play.result == 'success'
        run: |
          set -euo pipefail
          test -f site/play/index.html
          find site/play -maxdepth 1 -name '*_bg.wasm' -print -quit | grep -q .
          grep -q '/Zorvane/play/' site/play/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
