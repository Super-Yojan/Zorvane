name: Zorvane

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zorvane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential clang lld cmake \
            libwayland-dev libxkbcommon-dev libvulkan-dev libxcursor-dev \
            libxrandr-dev libxi-dev libx11-xcb-dev libasound2-dev libudev-dev \
            mesa-vulkan-drivers python3 python3-venv

      # A parallel Bevy link can exceed the GitHub-hosted runner memory.
      # Hosted images sometimes already have /swapfile active. fallocate on that
      # path fails with "Text file busy", so skip when swap is already large and
      # otherwise add a second file.
      - name: Add swap
        run: |
          set -euo pipefail
          have_kib=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          echo "SwapTotal=${have_kib:-0} kB"
          swapon --show || true
          # 12 GiB is enough headroom for the Bevy link on a hosted runner.
          if [ "${have_kib:-0}" -ge $((12 * 1024 * 1024)) ]; then
            echo "Existing swap is already sufficient."
            exit 0
          fi
          swapfile=/swapfile2
          if swapon --show=NAME --noheadings | grep -qx "$swapfile"; then
            echo "$swapfile is already active."
            exit 0
          fi
          sudo rm -f "$swapfile"
          sudo fallocate -l 16G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          swapon --show

      - name: Python client tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r simulator/tools/requirements.txt
          .venv/bin/python -m unittest discover -s simulator/tools -p 'test_*.py'

      - name: Cargo test
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo test --locked --workspace
