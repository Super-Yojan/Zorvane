name: Zorvane

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zorvane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential clang lld cmake \
            libwayland-dev libxkbcommon-dev libvulkan-dev libxcursor-dev \
            libxrandr-dev libxi-dev libx11-xcb-dev libasound2-dev libudev-dev \
            mesa-vulkan-drivers python3 python3-venv

      # A parallel Bevy link can exceed the GitHub-hosted runner memory.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Python client tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r simulator/tools/requirements.txt
          .venv/bin/python -m unittest discover -s simulator/tools -p 'test_*.py'

      - name: Cargo test
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: cargo test --locked --workspace
