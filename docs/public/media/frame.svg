<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-labelledby="title desc">
  <title id="title">Camera frame packet</title>
  <desc id="desc">A frame is a UTF-8 JSON header, one newline, then raw pixels.</desc>
  <rect width="720" height="180" fill="#f4f7f6"/>
  <text x="24" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#134e4a">One camera frame</text>
  <rect x="24" y="64" width="250" height="72" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="40" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#134e4a">JSON header</text>
  <text x="290" y="106" font-family="ui-monospace, monospace" font-size="22" fill="#0f766e">\n</text>
  <rect x="330" y="64" width="360" height="72" rx="8" fill="#0f766e"/>
  <text x="400" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#f8fafc">pixels, no row padding</text>
  <text x="24" y="164" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#475569">RGB is RGBA8. Depth is little-endian float32 metres. NaN means no return.</text>
</svg>
