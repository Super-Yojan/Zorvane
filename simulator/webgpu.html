<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zorvane</title>
    <link data-trunk rel="rust" data-bin="zorvane" data-cargo-no-default-features data-cargo-features="browser-bridge" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="css" href="web/bridge.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e2124;
        overflow: hidden;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <p id="bridge-status" role="status" aria-live="polite">Loading WebGPU simulator.</p>
    <script>
      const bridgeStatus = document.getElementById("bridge-status");
      let adapterUnavailable = false;
      if (!navigator.gpu) {
        bridgeStatus.textContent = "WebGPU is unavailable in this browser.";
      } else {
        navigator.gpu.requestAdapter().then((adapter) => {
          if (!adapter) {
            adapterUnavailable = true;
            bridgeStatus.textContent = "WebGPU is enabled, but Chrome could not provide a GPU adapter. Check chrome://gpu and your graphics driver.";
          }
        }).catch((error) => {
          adapterUnavailable = true;
          bridgeStatus.textContent = `WebGPU adapter request failed: ${error.message || error}`;
        });
        if (!location.hash.includes("endpoint=")) {
          bridgeStatus.textContent = "Client connection inactive. Open the pairing URL printed by the Zorvane client.";
        }
      }
      window.addEventListener("error", (event) => {
        if (adapterUnavailable) return;
        const detail = event.message || "Unknown browser error";
        bridgeStatus.textContent = `Simulator startup failed: ${detail}. Check the browser console, then reload the pairing URL.`;
      });
      window.addEventListener("unhandledrejection", (event) => {
        if (adapterUnavailable) return;
        const detail = event.reason?.message || String(event.reason || "Unknown browser error");
        bridgeStatus.textContent = `Simulator startup failed: ${detail}. Check the browser console, then reload the pairing URL.`;
      });
    </script>
  </body>
</html>
