[package]
name = "zorvane"
version.workspace = true
edition.workspace = true
description = "Zorvane world and competition simulator"
publish = false

[features]
default = ["native"]
# Threads, Zenoh, and the voxel mesher stay on the desktop build.
native = ["dep:zenoh", "dep:terra-transport", "dep:bevy_voxel_world", "dep:bevytiles"]

[dependencies]
zorvane-vehicle.workspace = true
terra-transport = { workspace = true, optional = true }
terra-autonomy.workspace = true
terra-navigation.workspace = true
terra-experiment.workspace = true
terra-mapping.workspace = true
terra-types.workspace = true
terra-state.workspace = true
terra-control.workspace = true
terra-waypoint.workspace = true
bevy = { version = "0.19.1", features = ["bevy_scene", "bevy_gltf"] }
bevytiles = { version = "0.1.0", optional = true }
bevy_water = { path = "vendor/bevy_water", default-features = false, features = ["embed_shaders"] }
avian3d = { git = "https://github.com/avianphysics/avian", rev = "af7e99c5c1da386aaa2b4c330e2adc96fa7ca6eb" }
bevy_voxel_world = { version = "=0.17.0", optional = true }
bevy_procedural_tree = "=0.4.0"
fastrand = "2.3"
zenoh = { version = "1.10.1", optional = true, default-features = false, features = ["transport_tcp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
# Transitive crates pull three getrandom majors. Each wasm target needs its
# JS backend or the crate fails to compile. Renames keep the versions distinct.
image = { version = "0.25", default-features = false, features = ["png"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
