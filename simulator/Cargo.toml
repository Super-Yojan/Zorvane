[package]
name = "zorvane"
version.workspace = true
edition.workspace = true
description = "Zorvane world and competition simulator"
publish = false

[dependencies]
# WebRTC FPV, as TerraPhone streams it. Same pins as ARGOS, so both ends speak
# the same fpv-signaling revision.
fpv-signaling = { git = "https://github.com/Super-Yojan/Terra.git", rev = "309042d518a918247b38fb0c004283a967447dcd" }
webrtc = "=0.17.2"
openh264 = "=0.9.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
bytes = "1"
terra-runtime.workspace = true
terra-observability = { path = "../../Terra/crates/terra-observability" }
zorvane-vehicle.workspace = true
terra-transport.workspace = true
terra-autonomy.workspace = true
terra-navigation.workspace = true
terra-experiment.workspace = true
terra-mapping.workspace = true
terra-types.workspace = true
terra-state.workspace = true
terra-control.workspace = true
terra-waypoint.workspace = true
# system_clipboard: paste into the online menu's text fields.
bevy = { version = "0.19.1", features = ["bevy_scene", "bevy_gltf", "system_clipboard"] }
avian3d = { git = "https://github.com/avianphysics/avian", rev = "af7e99c5c1da386aaa2b4c330e2adc96fa7ca6eb" }
fastrand = "2.3"
zenoh = { version = "1.10.1", default-features = false, features = ["auth_usrpwd", "transport_tcp", "transport_tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Multiplayer seats: signed commands (see src/lobby.rs).
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
# Pure-Rust ONNX inference for the shared bucket/ball detector (no native runtime to ship).
tract-onnx = "0.23.9"
tract-linalg = { version = "0.23.9", features = ["multithread-mm"] }

[[test]]
name = "observability"
path = "../tests/observability.rs"
